services:
  postgres:
    image: postgres:16-alpine
    container_name: novaflow-postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: novaflow
      POSTGRES_USER: novaflow
      POSTGRES_PASSWORD: novaflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
